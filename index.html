<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container-fluid">

    <h2 class="bg-info text-white text-center p-2">Amazon Shopping</h2>
 
    <ul class="nav nav-tabs border-primary">
        <li class="nav-item">
            <a href="#details" data-bs-toggle="tab" class="nav-link active">Details</a>
        </li>
        <li class="nav-item">
            <a href="#reviews" data-bs-toggle="tab" class="nav-link">Reviews</a>
        </li>
        <li class="nav-item">
            <a href="#offers" data-bs-toggle="tab" class="nav-link">Offers</a>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <div class="tab-pane fade show active" id="details">
            <h4>Product Details</h4>
            <p>This is the product description section.</p>
        </div>

        <div class="tab-pane fade" id="reviews">
            <h4>Customer Reviews</h4>
            <p>Here are some customer reviews.</p>
        </div>

        <div class="tab-pane fade" id="offers">
            <h4>Special Offers</h4>
            <p>Check out the latest offers.</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
